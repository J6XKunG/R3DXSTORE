#fx{position:fixed;inset:0;z-index:-1;pointer-events:none}
#prog{position:fixed;top:0;left:0;height:3px;width:100%;transform:scaleX(0);transform-origin:left;will-change:transform;z-index:60;background:linear-gradient(90deg,#ffdbe9,#ff8fbd)}
/* layout */
.nav{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 22px;background:#07060df5;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.5px;color:#ffd9e8;white-space:nowrap}
.lgo{display:block;flex:none;width:46px;height:34px;background:var(--logo) center/contain no-repeat}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:start;width:min(1220px,calc(100% - 32px));margin:0 auto;padding:24px 0 70px}
aside{position:sticky;top:84px;background:#151314f5;border:1px solid #262324;border-radius:26px;padding:10px}
.menu{position:relative;display:grid;gap:6px}.ind{position:absolute;left:0;top:0;border-radius:18px;background:var(--grad);box-shadow:0 8px 20px #0006;pointer-events:none;will-change:transform;transition:transform .55s var(--spring),width .45s var(--ease),height .45s var(--ease)}.ic{display:inline-block;font-style:normal;transition:transform .4s var(--spring)}.mi:hover .ic{transform:rotate(-12deg) scale(1.2)}.mi.on .ic{animation:wig .7s var(--spring)}@keyframes wig{30%{transform:scale(1.5) rotate(-18deg)}}
.mi{z-index:1;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:18px;background:#1d1a1c;border:1px solid #262324;font-weight:500;text-align:left;position:relative;overflow:hidden;transition:transform .4s var(--spring),background .3s}
.mi:hover{background:#2b2629;transform:translateX(3px)}.mi:active{transform:scale(.94)}.mi.on{background:transparent;color:#161616;border-color:transparent;transform:none}
.bd{margin-left:auto;min-width:24px;height:24px;border-radius:12px;display:grid;place-items:center;background:#3a3a3a;font-size:12px;padding:0 7px}.mi.on .bd{background:#161616;color:#fff}.bump{animation:bump .6s var(--spring)}@keyframes bump{40%{transform:scale(1.6)}}
.eyebrow{font-size:13px;color:var(--mut)}.sub{color:#b4b4b4;font-size:15px;line-height:1.8;max-width:560px;margin:0 0 28px}
#stage.leave{animation:out .18s ease-in forwards;pointer-events:none}@keyframes out{to{opacity:0;transform:translateY(-10px)}}#stage.enter>*{animation:in .6s var(--ease) backwards;animation-delay:calc(var(--i,0)*70ms)}@keyframes in{from{opacity:0;transform:translateY(22px) scale(.98)}}
/* buttons, inputs */
.btn{position:relative;overflow:hidden;padding:11px 22px;border-radius:999px;background:var(--grad);color:#151515;font-weight:600;font-size:14px;text-decoration:none;display:inline-block;text-align:center;transition:transform .4s var(--spring),box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px #ffb3d155}.btn:active{transform:scale(.93)}.btn:disabled{opacity:.5}
.btn.ghost{background:#2a2a2a;color:#eee}.btn.full{width:100%}.btn.sm{padding:7px 14px;font-size:13px}
.ripple{position:absolute;border-radius:50%;pointer-events:none;background:#ffffff40;transform:scale(0);animation:rp .65s var(--ease) forwards}@keyframes rp{to{transform:scale(1);opacity:0}}
.in{background:#252525;border:1px solid #333;border-radius:14px;padding:10px 12px;color:var(--tx);font:inherit;font-size:14px;width:100%;min-width:0;margin-bottom:10px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;font-size:12px;font-weight:600}.lang button{padding:6px 11px;color:var(--mut)}.lang .on{background:var(--grad);color:#151515}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:18px;box-shadow:0 14px 30px #0005;transition:transform .45s var(--ease),border-color .3s}
.card:hover{transform:translateY(-5px);border-color:var(--ac)}.card h3{margin:0 0 4px}.card p{margin:0;color:var(--mut);font-size:13px;line-height:1.6}
.pc{cursor:pointer;padding:12px 12px 16px}.pc h3{margin:12px 4px 4px;font-size:16px}.mt{margin:0 4px 12px;font-size:12px;color:var(--mut)}.mt b{color:#7be0a0}
.pimg{position:relative;aspect-ratio:1;border-radius:22px;overflow:hidden;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--ac) 35%,#201a1d),#161214 75%);border:1px solid #2c2427}
.pimg img,.art img,.fly img{width:100%;height:100%;object-fit:cover}.pc:hover .pimg img{transform:scale(1.07)}.pimg img{transition:transform .6s var(--ease)}
.bdg,.pp{position:absolute;background:#1a1215e6;color:var(--ac);font-weight:600;border-radius:999px}.bdg{top:8px;left:8px;font-size:12px;padding:5px 11px}.pp{right:8px;bottom:8px;font-size:17px;padding:6px 13px;border-radius:16px}
.tag{position:absolute;top:14px;right:14px;font-size:11px;padding:6px 11px;border-radius:999px;background:#333}
.art{height:112px;margin:6px 0 16px;border-radius:22px;display:grid;place-items:center;font-size:52px;overflow:hidden;background:radial-gradient(circle at 30% 20%,color-mix(in srgb,var(--ac) 35%,#202020),#1a1a1a 75%)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.price{font-weight:700;font-size:21px;color:var(--ac)}.price.big{font-size:32px}.price small{font-size:12px;color:var(--mut);font-weight:400}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#251c21;color:var(--ac);border-radius:999px;padding:5px 12px;font-size:12px}.chip.g{color:#7be0a0}
.pdh{display:flex;gap:22px;align-items:center;margin:18px 0 20px;flex-wrap:wrap}.pd-img{width:190px;flex:none;font-size:80px}
.dd{white-space:pre-line;color:#d6c6ce;line-height:1.9;font-size:15px;margin:14px 0 20px}.tipb{background:#241a20;border-radius:16px;padding:14px 16px;margin-bottom:18px;font-size:14px}
.empty{padding:46px 20px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed #3a3a3a;border-radius:28px}
/* home */
.hero{text-align:center;padding:58px 8px 34px}.hero .lg{position:relative;width:170px;height:124px;margin:0 auto 18px;background:var(--logo) center/contain no-repeat;animation:fl 4s ease-in-out infinite;will-change:transform}.hero .lg:before{content:'';position:absolute;inset:-25%;z-index:-1;background:radial-gradient(closest-side,#ff7ab84d,transparent)}@keyframes fl{50%{transform:translateY(-12px) rotate(4deg)}}
.hero h1{font-size:clamp(40px,8vw,72px);letter-spacing:3px;background:linear-gradient(90deg,#ffdbe9,#ff9ec6,#ffdbe9);-webkit-background-clip:text;background-clip:text;color:transparent}

<script>
/* ===== config: API = Worker URL, INVITE = Discord invite, ORDER_ENDPOINT = webhook ===== */
const CFG={ORDER_ENDPOINT:"",INVITE:"",API:"https://worker.anonpana6.workers.dev"};

/* ===== helpers ===== */

const J=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};

 fivem:{n:"FiveM",c:"#ffb3d1",d:["สคริปต์ ยานพาหนะ และไอเทมสำหรับเซิร์ฟเวอร์ FiveM ของคุณ","Scripts, vehicles and items for your FiveM server"],items:[["","Super Car Pack","รถสปอร์ต 10 คัน พร้อมแต่งสวย",390],["","Job Script","สคริปต์อาชีพ ตั้งค่าง่าย",290],["","Clothing Pack","เสื้อผ้าและแอคเซสซอรี่ 50 ชุด",190],["","VIP Priority","คิวพิเศษเข้าเซิร์ฟเวอร์ 30 วัน",150]]},
 minecraft:{n:"Minecraft",c:"#b5f0d0",d:["แรงค์ คีย์ และไอเทมสำหรับเซิร์ฟเวอร์ Minecraft","Ranks, keys and items for Minecraft servers"],items:[["","Rank VIP","ยศ VIP พร้อมคำสั่งพิเศษ",99],["","Crate Key x5","คีย์กล่องสุ่ม 5 ใบ",59],["","Coin 10,000","เหรียญในเซิร์ฟเวอร์",79],["","Fly Kit","โหมดบินและชุดเสริม 30 วัน",129]]},
 valorant:{n:"Valorant",c:"#ff9fb4",d:["เติม VP และไอเทมสำหรับ Valorant","VP top-ups and items for Valorant"],items:[["","VP 1,000","Valorant Points 1,000",299],["","VP 2,150","Valorant Points 2,150",599],["","Battle Pass","Battle Pass ซีซันปัจจุบัน",349],["","Skin Bundle","ชุดสกินปืนสุดพิเศษ",899]]},
 roblox:{n:"Roblox",c:"#b4d2ff",d:["Robux และ Game Pass สำหรับ Roblox","Robux and Game Passes for Roblox"],items:[["","Robux 400","Robux 400 R$",189],["","Robux 800","Robux 800 R$",359],["","Game Pass","Game Pass ตามที่เลือก",129],["","Premium 450","Roblox Premium 450",199]]}
};

for(const k in CATS)CATS[k].items[0][6]=true;                  // first item of each category is featured

/* ===== state ===== */
let me=J("gs_user",null);if(me&&(me.exp<Date.now()))me=null;
let hist=J("gs_hist",[]),bal=0,iv="",fs="",FEED=[],view="home",newId=null,ed=null,cur,qty=1,reg=0;

 .then(r=>r.json()).then(d=>{if(d.auth&&me)logout();return d});

const page=v=>v.startsWith("pd:")?pd(...v.split(":").slice(1)):({home,topup:topupPg,settings:settingsPg,admin:adm,history:histPg})[v]?.()||catPg(v);

const dlg=$("dlg");

function buy(key){
 if(CFG.API&&!me)return gate(1);
 const[k,i]=key.split(":");cur={k,i:+i,p:CATS[k].items[i],o:null};
 const op=cur.p[10]||[];if(op.length)cur.o=Math.max(0,op.findIndex(x=>x[2]==null||x[2]>0));
 dlg.style.setProperty("--ac",CATS[k].c);drawOpts();
 $("dArt").innerHTML=A(cur.p);$("dArt").style.setProperty("--ac",CATS[k].c);$("dName").textContent=cur.p[1];$("dDesc").textContent=dsc(cur.p).slice(0,100);$("dUnit").textContent=baht(unit());

}
$("dOpts").onclick=e=>{const b=e.target.closest("[data-o]");if(!b||b.disabled)return;cur.o=+b.dataset.o;drawOpts();$("dUnit").textContent=baht(unit());setQty(qty)};
$("minus").onclick=()=>setQty(qty-1);$("plus").onclick=()=>setQty(qty+1);$("dx").onclick=()=>dlg.close();
dlg.onclick=e=>e.target===dlg&&dlg.close();
$("back").onclick=()=>{$("s2").hidden=true;$("s1").hidden=false};

/* ===== language ===== */
function setLang(l){L=l;S("lang",l);applyLang();paint()}
function applyLang(){
 document.documentElement.lang=L;
 document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===L));
 document.querySelectorAll("[data-t]").forEach(n=>n.textContent=n.dataset.t.split("|")[L==="th"?0:1]);
 document.querySelectorAll("[data-tp]").forEach(n=>n.placeholder=n.dataset.tp.split("|")[L==="th"?0:1]);
 sw();buildMenu();renderUser();
}

/* ===== effects: scroll progress + meteor shower ===== */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.1});
let pr=0;addEventListener("scroll",()=>{pr||requestAnimationFrame(()=>{pr=0;$("prog").style.transform=`scaleX(${scrollY/(document.documentElement.scrollHeight-innerHeight||1)})`});pr=1},{passive:true});
(()=>{
 const cv=$("fx"),g=cv.getContext("2d",{alpha:true});let W,H,stars=[],meteors=[];
 const spr=document.createElement("canvas");spr.width=256;spr.height=6;           // one pre-drawn meteor tail, reused by every meteor
 {const s=spr.getContext("2d"),gr=s.createLinearGradient(0,0,256,0);gr.addColorStop(0,"#ffb3d100");gr.addColorStop(.7,"#ffb3d199");gr.addColorStop(1,"#fff");s.fillStyle=gr;s.beginPath();s.moveTo(0,3);s.lineTo(250,0);s.arc(250,3,3,-1.57,1.57);s.closePath();s.fill()}
 const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight;stars=Array.from({length:Math.min(70,W*H/14000|0)},()=>({x:Math.random()*W|0,y:Math.random()*H|0,r:Math.random()>.8?2:1,p:Math.random()*6}))};
 size();addEventListener("resize",size);
 const spawn=()=>{const v=9+Math.random()*8;meteors.push({x:Math.random()*W*1.2,y:-20,vx:-v,vy:v*.6,len:90+Math.random()*130,a:Math.atan2(v*.6,-v),s:.6+Math.random()*.6})};
 (function frame(){
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);g.fillStyle="#fff";
  for(const s of stars){s.p+=.03;g.globalAlpha=.3+.3*Math.sin(s.p);g.fillRect(s.x,s.y,s.r,s.r)}
  if(reduce)return;
  g.globalAlpha=1;
  if(meteors.length<5&&Math.random()<.03)spawn();
  for(const m of meteors){m.x+=m.vx;m.y+=m.vy;g.setTransform(1,0,0,1,m.x,m.y);g.rotate(m.a);g.drawImage(spr,-m.len,-3*m.s,m.len,6*m.s)}
  meteors=meteors.filter(m=>m.x>-300&&m.y<H+100);
  requestAnimationFrame(frame);
 })();
})();
